<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/estilos.css">
    <title>Reseña -Restaurante</title>
</head>

<body>
    <div class="sticky-top">
        <header>
            <h1 id="titulo">Restaurante el Buen Sabor</h1>
            <p>Comida preparada como en casa</p>
        </header>
        <nav class="nav nav-tabs justify-content-center">
            <a class="nav-link" href="./index.html">Inicio</a>
            <a class="nav-link active" href="#contacto">Contacto</a>
        </nav>
    </div>
    <main>
        <section id="contacto">
            <h2>Reseña</h2>
            <form>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Digite su nombre">
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo</label>
                    <input type="email" id="correo" name="correo" class="form-control" placeholder="correo@ejemplo.com">
                </div>
                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha visita</label>
                    <input type="date" id="fecha" name="fecha" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="personas" class="form-label">Cantidad Personas</label>
                    <input type="number" id="personas" name="personas" min="1" max="10" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="calificacion">Calificación</label>
                    <select id="calificacion" name="calificacion" class="form-select">
                        <option value="excelente">Excelente</option>
                        <option value="buena">Buena</option>
                        <option value="regular">Regular</option>
                        <option value="mala">Mala</option>
                    </select>
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="recomienda">
                    <label class="form-check-label" for="recomienda"> Recomendaría este restaurante</label>
                </div>
                <div class="mb-3">
                    <p>¿Dondé realizó su consumo?</p>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoConsumo" id="restaurante"
                            value="restaurante">
                        <label class="form-check-label"> Restaurante</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="tipoConsumo" id="llevar" value="llevar">
                        <label class="form-check-label"> Para llevar</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escriba su mensaje"
                        class="form-control"></textarea>
                </div>
                <button class="btn btn-primary" type="submit">Enviar</button>
                <!--<button class="btn btn-success" type="submit">Enviar</button>
                <button class="btn btn-danger" type="submit">Enviar</button>
                <button class="btn btn-warning" type="submit">Enviar</button>
                <button class="btn btn-dark" type="submit">Enviar</button>
                <button class="btn btn-secondary" type="submit">Enviar</button>-->
            </form>
        </section>
    </main>
    <footer>
        <p>Restaurante El Buen Sabor - 2026</p>
        <p>San José, Costa Rica</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
